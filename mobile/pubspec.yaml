name: gisam_app
description: Aplicación móvil integrada de GISAM.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter_appauth: ^12.1.0
  google_sign_in: ^6.2.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.3
  cloud_functions: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
    - assets/themes/ajustes/
    - assets/themes/comunidad/
    - assets/themes/ia/
    - assets/themes/inicio/
    - assets/themes/musica/
    - assets/themes/perfil/
    - assets/themes/tienda/
    - assets/themes/pets/
    - assets/themes/pets/mascotas/
    - assets/themes/pets/mascotas/gato/
