name: gisam_app
description: Aplicación móvil integrada de GISAM.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  google_sign_in: ^6.2.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
    - assets/app_icon.png
